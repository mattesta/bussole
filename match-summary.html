<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bussole! — Match summary</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="globe-prototype.css?v=23">
  <link rel="stylesheet" href="match-summary.css?v=3">
</head>
<body>
  <main id="summaryMap" aria-label="Match summary globe"></main>
  <section class="summary-panel">
    <h1>Match summary</h1>
    <nav aria-label="Summary view"><button id="personalView" class="selected">My guesses</button><button id="roomView" class="hidden">Room rounds</button></nav>
    <section id="roundPicker" class="hidden" aria-label="Choose round"><span>Round</span><div id="summaryRound" class="round-buttons" role="group" aria-label="Round"></div></section>
    <p id="summaryStatus" role="status">Loading your match…</p>
    <ol id="summaryStats"></ol>
    <div class="summary-links"><a id="summaryBack" href="./">Back to room</a><a href="./">Home</a></div>
  </section>
  <div class="summary-attribution">MapLibre · Tiles © Esri</div>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="scoring.js?v=3"></script><script src="globe-lines.js?v=1"></script>
  <script src="report-geometry.js?v=1"></script><script src="match-summary.js?v=4"></script>
</body>
</html>
