<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bussole! — Globe prototype</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="globe-prototype.css?v=18">
</head>
<body>
  <main id="globeMap" aria-label="Interactive 3D globe"></main>

  <aside class="target-card" aria-live="polite">
    <span class="target-label">TARGET</span>
    <strong id="prototypeTarget">Choose a target</strong>
    <span id="prototypeStatus" class="status">Preparing location and compass…</span>
    <span id="prototypeError"></span>
  </aside>

  <div id="globeSearchPanel" class="search-panel hidden" role="dialog" aria-modal="true" aria-labelledby="globeSearchTitle">
    <section class="search-card">
      <div class="search-heading">
        <span id="globeSearchTitle">SEARCH TARGET</span>
        <button id="globeSearchClose" type="button" aria-label="Close search">×</button>
      </div>
      <div class="search-row">
        <div class="search-input-wrap">
          <input id="globeSearchBox" placeholder="Pick any place..." autocomplete="off">
          <button id="globeClearSearch" type="button" aria-label="Clear search">×</button>
          <div id="globeSuggestions" class="suggestions"></div>
        </div>
        <button id="globeSearchBtn" type="button">Search</button>
      </div>
    </section>
  </div>

  <section class="game-controls" aria-label="Globe game controls">
    <label class="bearing-control" for="bearingInput">
      <span>Bearing</span>
      <output id="bearingValue" for="bearingInput">0°</output>
      <input id="bearingInput" type="range" min="0" max="359" value="0">
    </label>

    <label id="distanceInputWrap" class="distance-control hidden" for="distanceInput">
      <input id="distanceInput" type="number" min="0" step="1" inputmode="decimal" placeholder="Distance">
      <span>km</span>
    </label>

    <nav class="action-bar" aria-label="Game controls">
      <button id="randomTargetBtn" type="button">Random Target</button>
      <button id="openGlobeSearchBtn" type="button">Search</button>
      <button id="showPrototypeLineBtn" class="primary" type="button" disabled>Go!</button>
      <button id="resetPrototypeBtn" type="button">Reset</button>
      <a id="prototypeBackLink" class="home-button" href="./?map=3d">Home</a>
    </nav>
  </section>

  <div id="prototypeCompass" class="compass hidden" aria-label="Compass">
    <div class="compass-forward"></div>
    <div id="prototypeCompassNeedle" class="compass-needle" aria-hidden="true">
      <span class="needle-north"></span>
      <span class="needle-south"></span>
    </div>
    <div class="compass-center"></div>
  </div>

  <section id="globeMultiplayerResults" class="globe-results hidden" aria-live="polite">
    <button id="globeResultsClose" class="globe-results-close" type="button" aria-label="Close round results">×</button>
    <h2>Round results</h2>
    <ol id="globeRoundRanking"></ol>
    <button id="globeNextRoundBtn" class="hidden" type="button">Next round</button>
  </section>

  <button id="globeRoomBadge" class="globe-room-badge hidden" type="button" aria-label="Show round results">
    <span id="globeRoomProgress">0 explorers</span>
  </button>

  <div class="prototype-attribution">MapLibre · Tiles © Esri</div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="targets.js"></script>
  <script src="globe-prototype.js?v=18"></script>
  <script type="module" src="globe-multiplayer.js?v=1"></script>
</body>
</html>
