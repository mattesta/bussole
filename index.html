<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Bussole!</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <footer id="credits">
    By M Bonatesta
  </footer>

  <!-- ================= START MENU ================= -->
  <div id="menu">
    <h2>🧭 Bussole!</h2>

    <p>
      Point your phone towards the target, and plot the most precise route possible. <br> Whoever gets closer wins.
    </p>

    <button class="modeBtn" data-mode="easy">Easy (with compass)</button>
    <button class="modeBtn" data-mode="medium">Medium </button>
    <button class="modeBtn" data-mode="hard">Difficult (guess the distance too)</button>
    <button id="multiplayerBtn" type="button">Play multiplayer</button>
    <hr/>
    <label>
      <input type="checkbox" id="timerCheckbox">
      Enable timer
    </label>
    
    <div id="timerSettings" style="display:none; margin-top:8px;">
      <input type="number" id="timerDuration" placeholder="Duration (seconds)" min="1"/>
    </div>
    
    <label style="margin-top:12px;">
      <input type="checkbox" id="blurCheckbox">
      Enable blur around player
    </label>
  </div>

  <div id="multiplayerPanel" class="multiplayer-panel hidden" aria-live="polite">
    <button id="multiplayerClose" class="panel-close" type="button" aria-label="Close">×</button>
    <section id="multiplayerEntry">
      <h2>Multiplayer</h2>
      <p>Create a room or join your friends.</p>
      <button id="createRoomBtn" type="button">Create room</button>
      <button id="showJoinRoomBtn" type="button">Join room</button>
      <div id="joinRoomForm" class="hidden">
        <input id="roomCodeInput" inputmode="text" maxlength="8" placeholder="XX-XX-XX" autocomplete="off">
        <button id="joinRoomBtn" type="button">Join</button>
      </div>
    </section>
    <section id="multiplayerLobby" class="hidden">
      <div class="room-code-label">Room <strong id="roomCodeLabel"></strong></div>
      <label class="player-name-label">Explorer name
        <input id="playerNameInput" maxlength="24" autocomplete="off">
      </label>
      <ul id="roomPlayers"></ul>
      <div id="hostControls" class="hidden">
        <label>Difficulty
          <select id="roomMode"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Difficult</option></select>
        </label>
        <label><input id="roomTimerEnabled" type="checkbox"> Timer</label>
        <input id="roomTimerDuration" type="number" min="10" value="60" aria-label="Timer seconds">
        <div class="room-target-row">
          <input id="roomTargetInput" placeholder="Choose the target…" autocomplete="off">
          <button id="roomTargetSearch" type="button">Search</button>
          <button id="roomTargetRandom" type="button">Random</button>
        </div>
        <button id="startRoomRound" type="button" disabled>Start round</button>
      </div>
      <p id="roomMessage">Waiting for the host…</p>
      <button id="leaveRoomBtn" type="button">Leave room</button>
    </section>
    <section id="multiplayerResults" class="hidden">
      <h2>Round results</h2>
      <ol id="roundRanking"></ol>
      <button id="nextRoundBtn" class="hidden" type="button">Next round</button>
      <button id="resultsLeaveBtn" type="button">Leave room</button>
    </section>
  </div>

  <div id="roomBadge" class="room-badge hidden"><span id="roomBadgeCode"></span><span id="roomProgress"></span></div>
  


  <!-- ================= MAP ================= -->
  <div id="map"></div>
  
  <!-- ================= TIMER ================= -->
  <div id="timerBox" style="display:none;"></div>
  <div id="distanceEasterEgg" aria-live="polite">...where are you going?</div>

  <!-- ================= HUD ================= -->
  <div id="hud" style="display:none;">

    <div id="searchRow">
      <div id="searchInputWrap">
        <input id="searchBox" placeholder="Pick any place..." autocomplete="off" />
        <button id="clearSearchBtn" type="button" aria-label="Clear search">×</button>
        <div id="suggestions"></div>
      </div>
      <button id="searchBtn" type="button">Search</button>
      <button id="randomBtn" type="button">Random</button>
    </div>

    <hr/>

    <button id="startBtn">Start</button>
    <button id="showLineBtn" disabled>Show line</button>
    <button id="resetBtn" disabled>Reset</button>
    <button id="homeBtn">Home</button>

    <!-- Hard mode only -->
    <div id="distanceInputWrap" style="display:none;">
      <input id="distanceInput" type="number" placeholder="Distance"/>
      <span id="distanceUnit">km</span>
    </div>

    <div id="status">Bussole! ↑→↓←</div>
    <div id="distance"></div>
    
    <!-- Stable needle compass (easy mode only) -->
    <div id="compass" class="hidden">
      <div id="compassForwardMarker"></div>
      <div id="compassNeedle" aria-hidden="true">
        <span class="needleNorth"></span>
        <span class="needleSouth"></span>
      </div>
      <div id="compassCenter"></div>
    </div>
  </div>


  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
  <script src="targets.js"></script>
  <script src="app.js"></script>
  <script type="module" src="multiplayer.js"></script>
</body>
</html>
